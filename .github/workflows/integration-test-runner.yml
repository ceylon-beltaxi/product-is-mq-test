name: Integration Test Runner
on:
  workflow_dispatch:
    inputs:
      pr:
        description: "Enter PR link (ex: https://github.com/wso2-extensions/identity-inbound-auth-oauth/pull/1481)"
        default:
        required: true
  # Runs against the "base branch + queued PRs" commit that GitHub builds for
  # the merge queue.
  merge_group:
    types: [checks_requested]
  # The heavy matrix below is skipped for pull_request. This trigger exists only
  # so the required "Integration Tests" check is reported on the PR itself,
  # which GitHub requires before a PR can be added to the merge queue.
  pull_request:

env:
  MAVEN_OPTS: -Dhttp.keepAlive=false -Dmaven.wagon.http.pool=false -Dmaven.wagon.http.retryHandler.class=standard -Dmaven.wagon.http.retryHandler.count=3 -Djdk.util.zip.disableZip64ExtraFieldValidation=true -XX:+HeapDumpOnOutOfMemoryError

jobs:
  # merge_group does not support `paths` filters, so decide here whether the
  # queued change needs the integration tests at all. Files matching a regex in
  # .github/merge-queue-skip-paths.txt are ignored; if every changed file is
  # ignored the heavy matrix is skipped and the required check still passes.
  changes:
    name: Detect test-relevant changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run_tests: ${{ steps.filter.outputs.run_tests }}
    steps:
      - name: Check changed files
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          if [ "$EVENT" != "merge_group" ]; then
            echo "run_tests=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Skip list is read from the base branch, so a queued PR cannot widen it.
          gh api "repos/$GITHUB_REPOSITORY/contents/.github/merge-queue-skip-paths.txt?ref=$BASE_SHA" \
            -H "Accept: application/vnd.github.raw" > skip.txt || : > skip.txt
          grep -vE '^\s*(#|$)' skip.txt > patterns.txt || true
          gh api --paginate "repos/$GITHUB_REPOSITORY/compare/$BASE_SHA...$HEAD_SHA" \
            --jq '.files[] | .filename, (.previous_filename // empty)' > changed.txt
          echo "Changed files:"; cat changed.txt
          if [ ! -s changed.txt ]; then
            echo "Could not list changed files; running tests to be safe."
            echo "run_tests=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -s patterns.txt ]; then
            relevant=$(grep -vE -f patterns.txt changed.txt || true)
          else
            relevant=$(cat changed.txt)
          fi
          if [ -n "$relevant" ]; then
            echo "Test-relevant files:"; echo "$relevant"
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Only skip-listed files changed; integration tests skipped."
            echo "run_tests=false" >> "$GITHUB_OUTPUT"
          fi

  run-test-runners:
    needs: changes
    if: ${{ github.event_name != 'pull_request' && needs.changes.outputs.run_tests == 'true' }}
    runs-on: ${{ github.repository == 'wso2/product-is' && fromJSON(format('["codebuild-wso2_product-is-{0}-{1}"]', github.run_id, github.run_attempt)) || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner_id: 1
            tests: "is-tests-default-configuration,is-test-rest-api,is-test-webhooks,is-tests-scim2,is-test-adaptive-authentication"
          - runner_id: 2
            tests: "is-test-adaptive-authentication-nashorn,is-test-adaptive-authentication-nashorn-with-restart,is-tests-default-configuration-ldap,is-tests-uuid-user-store,is-tests-federation,is-tests-federation-restart,is-tests-connection-sharing"
          - runner_id: 3
            tests: "is-tests-oauth-client-secrets,is-tests-jdbc-userstore,is-tests-read-only-userstore,is-tests-oauth-jwt-token-gen-enabled,is-tests-email-username,is-tests-saml-query-profile,is-tests-default-encryption,is-test-session-mgt,is-tests-password-update-api"
          - runner_id: 4
            tests: "is-tests-with-individual-configuration-changes"
    steps:
      - name: Print Input
        run: echo "Running the Test runner ${{ matrix.runner_id }} for PR - ${{ github.event.inputs.pr }}"
      - name: Comment build info
        if: ${{ matrix.runner_id == 1 && github.event_name == 'workflow_dispatch' }}
        run: |
          owner=$(echo '${{github.event.inputs.pr}}' | cut -d "/" -f 4)
          repo=$(echo '${{github.event.inputs.pr}}' | cut -d "/" -f 5)
          pr_number=$(echo '${{github.event.inputs.pr}}' | cut -d "/" -f 7)
          curl -X POST https://api.github.com/repos/$owner/$repo/issues/$pr_number/comments -H 'Authorization: token ${{secrets.PR_BUILDER_COMMENT}}' -d '{"body":"PR builder started \nLink: https://github.com/wso2/product-is/actions/runs/${{github.run_id}}"}'
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
      - name: Echo java 21 home
        run: |
          echo "J21HOME=$JAVA_HOME" >> ${GITHUB_ENV}
        id: java-21-setup
      - name: Build init
        run: |
          echo "CURRENT_MONTH=$(date +%Y-%m)" >> ${GITHUB_ENV}
      - name: Cache maven packages
        id: cache-maven-m2
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2
            !~/.m2/repository/org/wso2/is/wso2is
          key: ${{ runner.os }}-pr-builder-${{ env.CURRENT_MONTH }}-${{ matrix.runner_id }}
      - name: Setup pnpm
        id: setup-pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest
          run_install: false
      - name: Run PR builder ${{ matrix.runner_id }}
        id: builder_step
        env:
          PR_LINK: ${{github.event.inputs.pr}}
          JAVA_21_HOME: ${{env.J21HOME}}
        run: |
          bash .github/scripts/pr-builder.sh ${{ matrix.runner_id }} "${{ matrix.tests }}"
      - name: Archive PR diff file
        if: ${{ matrix.runner_id == 1 && github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: repo-pr-diff
          path: |
            ${{steps.builder_step.outputs.REPO_NAME}}/diff.diff
          if-no-files-found: warn
      - name: Archive repo mvn build log
        if: ${{ matrix.runner_id == 1 && github.event_name == 'workflow_dispatch' && steps.builder_step.outputs.REPO_NAME != 'product-is' }}
        uses: actions/upload-artifact@v4
        with:
          name: repo-mvn-build-log
          path: |
            ${{steps.builder_step.outputs.REPO_NAME}}/mvn-build.log
          if-no-files-found: warn
      - name: Archive product-is mvn build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-is-mvn-build-log-${{ matrix.runner_id }}
          path: |
            product-is-${{ matrix.runner_id }}/mvn-build.log
          if-no-files-found: warn
      - name: Archive product-is surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-is-surefire-report-${{ matrix.runner_id }}
          path: |
            product-is-${{ matrix.runner_id }}/**/surefire-reports
          if-no-files-found: warn
      - name: Archive heap dump
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heap-dump
          path: |
            **/**.hprof
          if-no-files-found: ignore
  comment-and-approve:
    name: Comment the status and Approve PR
    needs: run-test-runners
    runs-on: ${{ github.repository == 'wso2/product-is' && fromJSON(format('["codebuild-wso2_product-is-{0}-{1}"]', github.run_id, github.run_attempt)) || 'ubuntu-latest' }}
    if: ${{ always() && github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Comment build status
        run: |
          owner=$(echo '${{github.event.inputs.pr}}' | cut -d "/" -f 4)
          repo=$(echo '${{github.event.inputs.pr}}' | cut -d "/" -f 5)
          pr_number=$(echo '${{github.event.inputs.pr}}' | cut -d "/" -f 7)
          curl -X POST https://api.github.com/repos/$owner/$repo/issues/$pr_number/comments -H 'Authorization: token ${{secrets.PR_BUILDER_COMMENT}}' -d '{"body":"PR builder completed \nLink: https://github.com/wso2/product-is/actions/runs/${{github.run_id}} \nStatus: ${{ needs.run-test-runners.result }}"}'
      - name: Approve PR
        if: ${{ needs.run-test-runners.result == 'success' }}
        run: |
          owner=$(echo '${{github.event.inputs.pr}}' | cut -d "/" -f 4)
          repo=$(echo '${{github.event.inputs.pr}}' | cut -d "/" -f 5)
          pr_number=$(echo '${{github.event.inputs.pr}}' | cut -d "/" -f 7)
          curl -X POST https://api.github.com/repos/$owner/$repo/pulls/$pr_number/reviews -H 'Authorization:token ${{secrets.PR_BUILDER_COMMENT}}' -d '{"body":"Approving the pull request based on the successful pr build https://github.com/wso2/product-is/actions/runs/${{github.run_id}}","event":"APPROVE"}'

  integration-tests:
    # Single stable check name to put in branch protection / merge queue
    # required checks. It is reported for pull_request (trivially green, the
    # matrix is skipped there) and for merge_group (green only if every runner
    # passed).
    name: Integration Tests
    needs: [changes, run-test-runners]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Report result
        run: |
          result="${{ needs.run-test-runners.result }}"
          echo "Event: ${{ github.event_name }}"
          echo "run-test-runners result: $result"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Integration tests run in the merge queue, not on the PR."
            exit 0
          fi
          if [ "${{ needs.changes.outputs.run_tests }}" = "false" ]; then
            echo "Only skip-listed files changed; integration tests were not required."
            exit 0
          fi
          if [ "$result" != "success" ]; then
            echo "::error::Integration tests did not pass (result: $result)."
            exit 1
          fi
